name: Backend Postman Tests (no Slack)

on:
  workflow_dispatch: {}

jobs:
  postman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman + reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Prepare output folder
        run: mkdir -p newman

      # 1) Login: export BOTH globals + environment (so tokens/vars persist exactly like Postman runner)
      - name: Run Login Collection (export env + globals)
        run: |
          newman run postman/WT_Login_Token.postman_collection.json \
            -e postman/DevEnv_CI.postman_environment.json \
            --env-var "login_email_admin=${{ secrets.LOGIN_EMAIL_ADMIN }}" \
            --env-var "login_password_admin=${{ secrets.LOGIN_PASSWORD_ADMIN }}" \
            --env-var "login_email_owner=${{ secrets.LOGIN_EMAIL_OWNER }}" \
            --env-var "login_password_owner=${{ secrets.LOGIN_PASSWORD_OWNER }}" \
            --env-var "login_email_pilot=${{ secrets.LOGIN_EMAIL_PILOT }}" \
            --env-var "login_password_pilot=${{ secrets.LOGIN_PASSWORD_PILOT }}" \
            --env-var "login_email_spectator=${{ secrets.LOGIN_EMAIL_SPECTATOR }}" \
            --env-var "login_password_spectator=${{ secrets.LOGIN_PASSWORD_SPECTATOR }}" \
            --env-var "login_email_superadmin=${{ secrets.LOGIN_EMAIL_SUPERADMIN }}" \
            --env-var "login_password_superadmin=${{ secrets.LOGIN_PASSWORD_SUPERADMIN }}" \
            --timeout-request 30000 \
            --timeout-script 30000 \
            --delay-request 200 \
            --export-globals newman/globals.json \
            --export-environment newman/env.after-login.json

      # (Optional) Debug: list variable *names* only (no secrets printed)
      - name: Debug exported variable names
        run: |
          node -e "const fs=require('fs'); \
            const e=JSON.parse(fs.readFileSync('newman/env.after-login.json','utf8')); \
            const g=JSON.parse(fs.readFileSync('newman/globals.json','utf8')); \
            console.log('ENV VARS:', (e.values||[]).map(v=>v.key).sort().join(', ')); \
            console.log('GLOBAL VARS:', (g.values||[]).map(v=>v.key).sort().join(', '));"

      # 2) Main collection: USE the exported environment + globals
      - name: Run Drone Display Name Collection (HTML report)
        run: |
          newman run postman/Drone_display_name.postman_collection.json \
            -e newman/env.after-login.json \
            -g newman/globals.json \
            --timeout-request 30000 \
            --timeout-script 30000 \
            --delay-request 200 \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman/report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman/report.html
          if-no-files-found: warn
