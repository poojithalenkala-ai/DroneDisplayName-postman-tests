      - name: Debug: list environment variable keys (no secrets)
        run: |
          echo "---- Env keys in DevEnv_CI ----"
          node -e "
            const fs=require('fs');
            const e=JSON.parse(fs.readFileSync('postman/DevEnv_CI.postman_environment.json','utf8'));
            const vals=(e.values||[]).map(v=>v.key).sort();
            console.log(vals.join('\n'));
          "
