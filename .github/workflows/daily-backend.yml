name: Backend Postman Tests

on:
  workflow_dispatch: {}
  schedule:
    # 9:00 PM America/Chicago (CST/CDT handled automatically)
    - cron: "0 3 * * *"

jobs:
  postman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman + HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Prepare output folder
        run: mkdir -p newman

      # 1) Login: export globals (tokens)
      - name: Run Login Collection (export globals)
        run: |
          newman run postman/WT_Login_Token.postman_collection.json \
            -e postman/DevEnv_CI.postman_environment.json \
            --env-var "login_email_admin=${{ secrets.LOGIN_EMAIL_ADMIN }}" \
            --env-var "login_password_admin=${{ secrets.LOGIN_PASSWORD_ADMIN }}" \
            --env-var "login_email_Owner=${{ secrets.LOGIN_EMAIL_OWNER }}" \
            --env-var "login_password_Owner=${{ secrets.LOGIN_PASSWORD_OWNER }}" \
            --env-var "login_email_pilot=${{ secrets.LOGIN_EMAIL_PILOT }}" \
            --env-var "login_password_pilot=${{ secrets.LOGIN_PASSWORD_PILOT }}" \
            --env-var "login_email_spectator=${{ secrets.LOGIN_EMAIL_SPECTATOR }}" \
            --env-var "login_password_spectator=${{ secrets.LOGIN_PASSWORD_SPECTATOR }}" \
            --env-var "login_email_superadmin=${{ secrets.LOGIN_EMAIL_SUPERADMIN }}" \
            --env-var "login_password_superadmin=${{ secrets.LOGIN_PASSWORD_SUPERADMIN }}" \
            --env-var "login_email_executiveadmin=${{ secrets.LOGIN_EMAIL_EXECUTIVEADMIN }}" \
            --env-var "login_password_executiveadmin=${{ secrets.LOGIN_PASSWORD_EXECUTIVEADMIN }}" \
            --env-var "login_email_csuite=${{ secrets.LOGIN_EMAIL_CSUITE }}" \
            --env-var "login_password_csuite=${{ secrets.LOGIN_PASSWORD_CSUITE }}" \
            --timeout-request 30000 \
            --timeout-script 30000 \
            --delay-request 200 \
            --export-globals newman/globals.json

      # 2) Main collection: use exported globals (tokens)
      - name: Run Drone Display Name Collection (HTML report)
        run: |
          newman run postman/Drone_display_name.postman_collection.json \
            -e postman/DevEnv_CI.postman_environment.json \
            -g newman/globals.json \
            --timeout-request 30000 \
            --timeout-script 30000 \
            --delay-request 200 \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman/report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman/report.html
          if-no-files-found: warn

      # Slack notification (uses same webhook => same "Postman CI Bot" picture/name)
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not set; skipping Slack notification."
            exit 0
          fi

          if [ "$STATUS" = "success" ]; then
            STATUS_TEXT="success"
          else
            STATUS_TEXT="failure"
          fi

          payload=$(cat <<EOF
          {
            "text": "🚀 Daily Postman Tests Completed\n\nStatus: ${STATUS_TEXT}\nBranch: ${BRANCH}\nRun: ${RUN_NUMBER}\nURL: ${RUN_URL}"
          }
          EOF
          )

          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
